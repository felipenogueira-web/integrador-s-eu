
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedido Confirmado - AXIS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #ffffff;
            color: #000000;
        }

        /* CABEÇALHO */

        .cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;

            height: 175px;
            padding: 0 6%;

            background: #000000;
        }

        .logo {
            font-size: 58px;
            font-weight: 900;
            letter-spacing: -4px;

            color: #ffffff;
        }

        .logo span {
            color: #ff6900;
        }

        .barra-pesquisa {
            display: flex;
            align-items: center;

            width: 370px;
            height: 40px;

            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        .barra-pesquisa input {
            width: 100%;
            height: 100%;

            padding: 0 20px;

            border: none;
            outline: none;

            font-size: 16px;
        }

        .barra-pesquisa button {
            width: 50px;
            height: 100%;

            border: none;
            background: #ffffff;

            font-size: 20px;
            cursor: pointer;
        }

        .icones {
            display: flex;
            align-items: center;
            gap: 35px;

            color: #ffffff;
            font-size: 35px;
        }

        .icone {
            cursor: pointer;
        }

        /* CONTEÚDO PRINCIPAL */

        .confirmacao {
            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: calc(100vh - 175px);

            padding: 80px 20px;

            text-align: center;
        }

        /* ÍCONE DE CONFIRMAÇÃO */

        .icone-confirmacao {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 120px;
            height: 120px;

            border: 12px solid #2dcc5b;
            border-radius: 50%;

            color: #2dcc5b;

            font-size: 85px;
            font-weight: bold;
            line-height: 1;
        }

        /* TEXTOS */

        .confirmacao h1 {
            margin: 25px 0 20px;

            color: #00c853;

            font-size: 34px;
            font-weight: 400;
        }

        .confirmacao p {
            margin: 0 0 22px;

            font-size: 23px;
        }

        /* BOTÃO */

        .botao-detalhes {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 410px;
            max-width: 100%;
            min-height: 52px;

            padding: 12px 20px;

            background: #ff6900;
            border: none;
            border-radius: 15px;

            color: #ffffff;

            font-size: 20px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;
        }

        .botao-detalhes:hover {
            background: #d95500;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 700px) {

            .cabecalho {
                height: auto;
                padding: 25px;

                flex-wrap: wrap;
                gap: 20px;
            }

            .barra-pesquisa {
                order: 3;
                width: 100%;
            }

            .logo {
                font-size: 45px;
            }

            .icones {
                gap: 15px;
                font-size: 28px;
            }

            .confirmacao {
                padding-top: 60px;
            }

            .confirmacao h1 {
                font-size: 28px;
            }

            .confirmacao p {
                font-size: 19px;
            }

        }

    </style>
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="cabecalho">

        <div class="logo">
            AX<span>I</span>S
        </div>

        <form class="barra-pesquisa" id="form-pesquisa">

            <input
                type="search"
                placeholder="Pesquisar"
                aria-label="Pesquisar"
            >

            <button type="submit">
                🔎
            </button>

        </form>

        <div class="icones">

            <span class="icone" title="Minha conta">◉</span>

            <span class="icone" title="Carrinho">🛒</span>

            <span class="icone" title="Menu">☰</span>

        </div>

    </header>


    <!-- CONFIRMAÇÃO DO PEDIDO -->

    <main class="confirmacao">

        <div class="icone-confirmacao">
            ✓
        </div>

        <h1>Pedido Confirmado!</h1>

        <p>Obrigado por escolher a Axis</p>

        <a
            class="botao-detalhes"
            href="detalhes-pedido.html"
        >
            VER DETALHES DO PEDIDO
        </a>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        const pesquisa = document.querySelector("#form-pesquisa");

        pesquisa.addEventListener("submit", function(evento) {

            evento.preventDefault();

            alert("Função de pesquisa em desenvolvimento.");

        });

    </script>

</body>

</html>
